<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="《虚空电台 1680 AM》离线电子辅助工具">
  <title>虚空电台 1680 AM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app-main">跳至主要内容</a>
  <div class="site-shell">
    <header class="station-header">
      <button class="wordmark" type="button" data-action="go-home" aria-label="返回主界面">
        <span class="wordmark-main">VOID 1680 AM</span>
        <span class="wordmark-sub">AMPLITUDE MODULATION SERVICE</span>
      </button>
      <div class="header-instruments" aria-label="电台状态">
        <div class="signal-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span class="frequency">1680 <small>kHz</small></span>
        <span class="on-air"><b></b> ON AIR</span>
      </div>
    </header>
    <main id="app-main" tabindex="-1"></main>
    <footer class="station-footer">
      <span>VOID 1680 AM / LOCAL SIGNAL</span>
      <span id="save-indicator" role="status" aria-live="polite">STANDBY</span>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="js/rules.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
